aid: alchemize
name: Alchemize
description: >-
  Alchemize is an AI-enabled customs brokerage that automates import compliance
  workflows for importers. The Y Combinator (Spring 2026) company pairs licensed
  customs expertise with artificial intelligence to answer regulatory and tariff
  questions in minutes rather than days, reduce manual data-entry errors before
  shipments reach the port, and give importers a single view of every shipment,
  status, and communication via API, EDI, or web portal. Founded by Robert Hou
  (previously Confido, YC) and Samuel Fu (previously Netflix), Alchemize targets
  inefficiency in the $30B+ customs brokerage industry with an AI-native
  compliance and trade-operations platform.
